name: Order reliability checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --root . netlify/functions/_lib/durableOrders.test.ts netlify/functions/_lib/orderNotifications.test.ts netlify/functions/_lib/calendarOrders.test.ts
      - run: pnpm check
      - run: pnpm build
